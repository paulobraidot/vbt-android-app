name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: find app/build/outputs/apk/ -name "*.apk" -exec cp {} vbt-android-app.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbt-android-app
          path: vbt-android-app.apk
